# Tooling configuration for the RAG Document Q&A project.
#
# WHY this file exists: CLAUDE.md names ruff, black, mypy and radon as the
#      quality bar, but no configuration recorded what that bar actually was.
#      The first run of ruff over this repo produced 231 findings, of which the
#      large majority were real (dead imports, unsorted import blocks, and the
#      pre-PEP-585 typing the project standard already forbids) and a handful
#      were deliberate design the linter cannot know about. Writing the rules
#      down makes the standard enforceable and stops the exceptions being
#      re-argued every time someone runs the tool.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# WHY these five: they map onto what CLAUDE.md already asks for — PEP 8 style
#      (E/W), real dead code and undefined names (F), grouped and sorted imports
#      (I), modern PEP 585/604 typing (UP), and the bug patterns bugbear catches
#      (B). Opinion-heavy families (TRY, RUF style rules, the security linter's
#      test-suite noise) are left out deliberately: a linter nobody can get to
#      zero is a linter everybody learns to ignore.
select = ["E", "W", "F", "I", "B", "UP"]

ignore = [
    # WHY: the codebase uses descriptive messages at the raise site rather than
    #      one exception class per message. B904 aside, that is a deliberate
    #      style, and this project's exception guidance is about *layering*
    #      (domain-translate, do not swallow), which no rule here checks.
    "E501",  # line length is advisory here; see line-length below
]

[tool.ruff.lint.per-file-ignores]
# WHY E402 here: several test modules bootstrap sys.path with the project root
#      before importing src.*, because the package is not pip-installed. The
#      imports are deliberately below that bootstrap.
# WHY E731 here: a one-line lambda is the clearest way to express a stub.
"tests/*" = ["E402", "E731"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# WHY not strict: SQLModel's table classes and ChromaDB's client are untyped at
#      the edges. The project rule that matters — no `Any`, no `type: ignore` to
#      silence a design problem — is enforced in review, not by a flag.

# WHY this exception exists — read before removing it.
#
# The three real provider adapters receive their SDK client through an injected
# zero-arg factory typed `Callable[[], object]` (see docs/adr/0002). `object` is
# the honest type: the adapter is handed whatever the factory built, and the
# factory's job is precisely that the SDK may be absent.
#
# Two better-looking fixes were tried and rejected:
#   1. Naming the real client types under TYPE_CHECKING (`openai.OpenAI`,
#      `anthropic.Anthropic`). This works for the attribute access, but the SDKs
#      then reject the adapters' `**dict[str, object]` request kwargs against
#      their own overloads. Those kwargs are assembled dynamically on purpose —
#      `temperature` is dropped for constrained models, `system` is added only
#      when present — so satisfying the overloads means rebuilding the SDKs'
#      TypedDicts here.
#   2. Structural Protocols for the client *and* every response object the
#      adapters read. Around twenty types per provider to describe a response
#      tree we neither own nor control, with `create()` returning a response in
#      one call and an iterable of chunks in the other.
#
# So the exception is scoped to `attr-defined` in the adapters package, written
# down once, rather than `Any` in a signature or `# type: ignore` at six call
# sites — both of which the project rules forbid, and rightly: they hide the
# boundary instead of naming it. Every adapter's behaviour is covered by
# tests/test_llm_adapters.py with injected fakes.
[[tool.mypy.overrides]]
module = "src.llm_handler.adapters.*"
disable_error_code = ["attr-defined"]
